<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e3e1dc;
  --accent:#2f5d50; --accent-soft:#e3eee9;
  --red:#c2362b; --red-soft:#fbe6e3; --orange:#b85c00; --orange-soft:#fdeedb;
  --yellow:#8a6d00; --yellow-soft:#faf3d2; --gray-soft:#efeeea;
  --free:#1f7a4d; --free-soft:#dff3e7; --paid:#7a4a1f; --paid-soft:#f5e9dc;
  --chip:#efeeea; --chip-on:#1d1d1f; --chip-on-ink:#fff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#16171a; --panel:#1f2024; --ink:#ececee; --sub:#9a9aa2; --line:#33343a;
    --accent:#7fc3ae; --accent-soft:#22332e;
    --red:#ff8a7f; --red-soft:#3a2321; --orange:#f3a85a; --orange-soft:#3a2d1d;
    --yellow:#e2c55a; --yellow-soft:#332e1a; --gray-soft:#2a2b30;
    --free:#7fd3a4; --free-soft:#1f3328; --paid:#e0b58c; --paid-soft:#3a2f24;
    --chip:#2a2b30; --chip-on:#ececee; --chip-on-ink:#16171a;
   color-scheme:dark; } }
:root[data-theme="dark"]{
    --bg:#16171a; --panel:#1f2024; --ink:#ececee; --sub:#9a9aa2; --line:#33343a;
    --accent:#7fc3ae; --accent-soft:#22332e;
    --red:#ff8a7f; --red-soft:#3a2321; --orange:#f3a85a; --orange-soft:#3a2d1d;
    --yellow:#e2c55a; --yellow-soft:#332e1a; --gray-soft:#2a2b30;
    --free:#7fd3a4; --free-soft:#1f3328; --paid:#e0b58c; --paid-soft:#3a2f24;
    --chip:#2a2b30; --chip-on:#ececee; --chip-on-ink:#16171a;
   color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px 10px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.meta{color:var(--sub);font-size:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px}
.stat b{font-size:15px;margin-right:3px}
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;align-items:center}
.group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.group > span{color:var(--sub);font-size:12px;margin-right:2px}
.chip{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
input[type=search],select{font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input[type=search]{width:220px}
label.tg{font-size:12px;display:flex;gap:4px;align-items:center;cursor:pointer}
main{padding:12px 20px 60px;max-width:1500px;margin:0 auto}
.month{font-size:13px;font-weight:700;color:var(--sub);margin:22px 0 6px;padding-left:2px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:28px 92px 1fr 150px 150px 120px 120px;gap:12px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row.past{opacity:.45}
.star{border:0;background:none;font-size:18px;cursor:pointer;color:var(--sub);padding:0;line-height:1}
.star.on{color:#e0a800}
.dis{border:0;background:none;font-size:17px;cursor:pointer;color:var(--sub);padding:0;line-height:1;font-family:inherit}
.dis:hover{color:var(--red)}
.sx{display:flex;flex-direction:column;gap:8px;align-items:center}
.row.dismissed,.card.dismissed{opacity:.45}
.due{text-align:center;border-radius:8px;padding:4px 2px;background:var(--gray-soft)}
.due .d{font-size:20px;font-weight:700;line-height:1.1}
.due .u{font-size:11px}
.due .dt{font-size:11px;color:var(--sub)}
.due.r{background:var(--red-soft);color:var(--red)} .due.o{background:var(--orange-soft);color:var(--orange)}
.due.y{background:var(--yellow-soft);color:var(--yellow)}
.name{font-weight:700;font-size:14.5px}
.name a{color:var(--ink);text-decoration:none} .name a:hover{text-decoration:underline}
.sub{color:var(--sub);font-size:12px;margin-top:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--chip);white-space:nowrap}
.tag.prep{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.warn{background:var(--orange-soft);color:var(--orange)}
.cell .k{font-size:11px;color:var(--sub)}
.cell .v{font-size:13px}
.fee.free{color:var(--free);font-weight:700}
.ent{display:inline-block;font-size:12px;border-radius:5px;padding:1px 7px;font-weight:700}
.ent.U{background:var(--free-soft);color:var(--free)} .ent.M{background:var(--accent-soft);color:var(--accent)}
.ent.C,.ent.O{background:var(--paid-soft);color:var(--paid)} .ent.N{background:var(--chip);color:var(--sub)}
.links{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.btn{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;text-decoration:none;color:var(--ink);background:var(--panel);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.detail{grid-column:3 / -1;font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:6px;display:none}
.row.open .detail{display:block}
.more{border:0;background:none;color:var(--sub);cursor:pointer;font-size:11px;padding:0;margin-top:3px}
.empty{padding:40px;text-align:center;color:var(--sub)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
/* ===== タイムライン ===== */
:root{ --g1:#2f6fb0; --g2:#c0692a; --g3:#8a4fb0; --g4:#2f8a5a; --g5:#b03a5b; --g6:#7a7a7a; --g7:#a08a1a; --wk:#fbfaf8; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --g1:#6fa8e0; --g2:#e8a070; --g3:#c49ae0; --g4:#6fcf9a; --g5:#e88aa5; --g6:#a8a8b0; --g7:#d8c060; --wk:#1b1c20;  color-scheme:dark; } }
:root[data-theme="dark"]{ --g1:#6fa8e0; --g2:#e8a070; --g3:#c49ae0; --g4:#6fcf9a; --g5:#e88aa5; --g6:#a8a8b0; --g7:#d8c060; --wk:#1b1c20;  color-scheme:dark; }
.view{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.view button{border:0;background:var(--panel);color:var(--ink);font:inherit;font-size:12px;padding:4px 12px;cursor:pointer}
.view button.on{background:var(--chip-on);color:var(--chip-on-ink)}
.tl{display:grid;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tl-head{display:contents}
.tl-head > div{position:sticky;top:var(--hh,0px);z-index:3;background:var(--panel);border-bottom:2px solid var(--line);padding:8px 8px;font-size:12px;font-weight:700}
.tl-head .gname{border-top:4px solid var(--gc)}
.tl-head .gname small{color:var(--sub);font-weight:400;margin-left:4px}
.tl-row{display:contents}
.tl-row > div{border-bottom:1px solid var(--line);padding:6px;min-height:46px}
.tl-row.alt > div{background:var(--wk)}
.tl-row.mstart > div{border-top:2px solid var(--sub)}
.tl-row .cellg{border-left:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.wk{font-size:12px;line-height:1.35}
.wk .m{font-size:15px;font-weight:700}
.wk .rel{color:var(--sub);font-size:11px}
.wk.now .rel{color:var(--red);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:7px;padding:5px 7px;font-size:12px;line-height:1.4;cursor:pointer}
.card:hover{border-color:var(--gc)}
.card .c-top{display:flex;gap:6px;align-items:baseline;justify-content:space-between}
.card .c-date{font-weight:700;white-space:nowrap}
.cid{font-size:11px;font-weight:400;color:var(--sub);margin-left:6px;font-variant-numeric:tabular-nums}
.card .c-left{font-size:11px;white-space:nowrap;border-radius:4px;padding:0 5px;background:var(--gray-soft)}
.card .c-left.r{background:var(--red-soft);color:var(--red)} .card .c-left.o{background:var(--orange-soft);color:var(--orange)} .card .c-left.y{background:var(--yellow-soft);color:var(--yellow)}
.card .c-name{font-weight:700;font-size:12.5px;margin-top:1px}
.card .c-name a{color:var(--ink);text-decoration:none} .card .c-name a:hover{text-decoration:underline}
.card .c-sum{color:var(--sub);margin-top:1px}
.card .c-prize{margin-top:2px;font-size:12px}
.card .c-prize b{font-size:12.5px}
.card .c-prize span{color:var(--sub);font-size:11px}
.card .c-judge{margin-top:2px;font-size:11.5px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.card .c-judge .m{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;background:var(--accent-soft);color:var(--accent)}
.card .c-judge .m.paper{background:var(--orange-soft);color:var(--orange)}
.card .c-subs{margin-top:2px;font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .c-subs{display:none}
.card .c-subs span{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:2px}
ul.subs{margin:2px 0 4px;padding-left:18px}
.card .c-foot{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:3px}
.card .fee-b{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;background:var(--paid-soft);color:var(--paid)}
.card .fee-b.free{background:var(--free-soft);color:var(--free)}
.card .ent{font-size:10.5px;padding:0 5px}
.card .gtag{display:none;font-size:11px;color:var(--gc);font-weight:700}
.card .star{font-size:14px;margin-left:auto}
.card .dis{font-size:14px;margin-left:4px}
.cpy{border:0;background:none;font-size:15px;cursor:pointer;color:var(--sub);padding:0 2px;line-height:1;font-family:inherit}
.cpy:hover,.star:hover,.dis:hover{color:var(--ink)}
.card .cpy{font-size:14px;margin-left:auto}
.card .cpy + .star{margin-left:6px}
.card .c-more{display:none;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);color:var(--sub)}
.card.open .c-more{display:block}
.card .c-more .btn{margin:4px 4px 0 0;display:inline-block}
.card.reg{border-style:dashed;border-left-style:solid;background:transparent;opacity:.85}
.card.prep .c-name::after{content:"準備済み";font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
@media (max-width:900px){
  .tl{display:block;border:0;background:none}
  .tl-head{display:none}
  .tl-row{display:block;margin-bottom:10px}
  .tl-row > div{border:0;padding:3px 0;min-height:0;background:none !important}
  .tl-row .cellg{border:0}
  .tl-row .cellg:empty{display:none}
  .tl-row.mstart > div{border:0}
  .tl-row .wk{position:sticky;top:0;background:var(--bg) !important;padding:6px 0;z-index:2;border-bottom:1px solid var(--line)}
  .card .gtag{display:inline}
}
@media (max-width:1000px){
  header{position:static}
  .row{grid-template-columns:28px 80px 1fr;}
  .row .cell,.row .links{grid-column:3}
  .row .cell{display:flex;gap:8px;align-items:baseline}
  .links{flex-direction:row}
  input[type=search]{width:100%}
}
@media (max-width:600px){
  header,main{padding-left:16px;padding-right:16px}
  .stats{margin-left:0}
}

// 各コンペの準備フォルダ（X046_… など）が置いてある場所。このHTMLから見た相対パス。
const FOLDER_BASE = "../../";
const LOCAL = location.protocol==="file:";
const FOLDER_BASE_WIN = "C:\\Users\\lapla\\Dropbox (Business)\\_2026_Project\\";
// まとめ（A3ペライチ・まとめPDF・md）へのボタン。列は update.py が各フォルダの 06_report と A3まとめ/ から自動で埋める
// アプリ版：A3ペライチは画像（a3/X047.jpg など）で開く。PDF も同じ場所に置いてある
const A3_CODES = new Set(["X039", "X042", "X046", "X047", "X048", "X049", "X050", "X051", "X052", "X053", "X054", "X057", "X065"]);
function a3code(r){ const c=(r["フォルダ"]||"").split("_")[0]; return A3_CODES.has(c)? c : ""; }
function a3Btn(r){ const c=a3code(r); return c? `<button class="a3b" type="button" data-a3="${c}">A3</button>` : ""; }
function docBtns(r){
  if(!LOCAL){ const c=a3code(r); return c? `<button class="a3b" type="button" data-a3="${c}">📄 A3ペライチ</button>` : ""; }
  return [["A3まとめ","📄 A3ペライチ"],["まとめPDF","📘 まとめPDF"],["まとめmd","📝 md"]]
    .filter(([c])=>r[c]).map(([c,t])=>`<a class="btn" href="${esc(encodeURI(r[c]))}" target="_blank">${t}</a>`).join("");
}

// 最初は隠しておく分野（「隠した分野も表示」にチェックすると出る）
const HIDDEN_FIELDS = ["グラフィック・ロゴ","アワード（完成作品）"];
// 応募資格が学生（中高生を含む）だけのコンペ。対象の欄から判定し、最初は隠す
// 年齢制限で1993年生まれが応募できないコンペ（備考に「年齢対象外」と書いたもの）。最初は隠す
function ageOut(r){ return /年齢対象外/.test(r["備考"]||""); }
function studentOnly(r){ const t=r["対象"]||""; return /学生|中高生|高校生|小6/.test(t) && !/実務|若手|一般|不問|社会人|個人|デザイナー|建築家|企業|歳/.test(t); }
const ENT_CODE = {"無制限":"U","複数可":"M","上限あり":"C","1点":"O","記載なし":"N"};
const WD = "日月火水木金土";
const $ = s => document.querySelector(s);

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){ row.push(f); f=""; }
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&text[i+1]=='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  const head = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}

const today = new Date(); today.setHours(0,0,0,0);
function toDate(s){ const m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s||""); return m? new Date(+m[1],m[2]-1,+m[3]) : null; }
function daysLeft(d){ return d? Math.round((d-today)/86400000) : null; }
function fmt(d){ return d? `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）` : "未定"; }
function num(s){ const n=parseFloat(String(s).replace(/[,，円\s]/g,"")); return isNaN(n)? null : n; }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function yen(n){ if(n==null) return ""; if(n>=10000) return `約${(n/10000).toLocaleString("ja-JP",{maximumFractionDigits:1})}万円`; return `約${n.toLocaleString("ja-JP")}円`; }

let DATA=[];
function load(csvText, label){
  DATA = parseCSV(csvText).map((r,i)=>{
    const due = toDate(r["締切"]), reg = toDate(r["登録締切"]);
    return {...r, _i:i, _due:due, _left:daysLeft(due), _reg:reg, _regLeft:daysLeft(reg),
      _fee:num(r["応募料_円"]), _prize:num(r["賞金_円"]),
      _free: /^無料|記載なし/.test(r["応募料"]) && !num(r["応募料_円"]),
      _key: r["管理番号"] || (r["コンペ"]||"")+"|"+(r["締切"]||"")};
  });
  $("#meta").textContent = `${label}・今日 ${fmt(today)}`;
  migrateMarks();
  buildChips(); render();
}

// ===== ★（このブラウザに保存） =====
function getStars(){ try{ return new Set(JSON.parse(localStorage.getItem("compe-stars")||"[]")); }catch(e){ return new Set(); } }
function setStars(s){ try{ localStorage.setItem("compe-stars", JSON.stringify([...s])); }catch(e){} }
let STARS = getStars();
// ===== ×で非表示（このブラウザに保存。「×で隠したものも表示」で出して ↺ で戻す） =====
function getDismissed(){ try{ return new Set(JSON.parse(localStorage.getItem("compe-dismissed")||"[]")); }catch(e){ return new Set(); } }
function setDismissed(s){ try{ localStorage.setItem("compe-dismissed", JSON.stringify([...s])); }catch(e){} }
let DISMISSED = getDismissed();
// 管理番号_コンペ名 をコピーするボタン（フォルダ名用。Windows で使えない文字は _ に）
function cpyName(r){ return `${r["管理番号"]?r["管理番号"]+"_":""}${(r["コンペ"]||"").replace(/[\\/:*?"<>|]/g,"_").replace(/\s+/g," ").trim()}`; }
function cpyBtn(r){ return `<button class="cpy" type="button" data-name="${esc(cpyName(r))}" title="「${esc(cpyName(r))}」をコピー" aria-label="名前をコピー">⧉</button>`; }
function copyText(t, msg){
  const ok=()=>toast(msg||"コピーしました");
  const fb=()=>{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy")? ok() : toast(t); }catch(e){ toast(t); } ta.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fb); else fb();
}
function disBtn(r){ const d=DISMISSED.has(r._key); return `<button class="dis" type="button" title="${d?"非表示をやめて戻す":"このコンペを非表示にする"}" aria-label="${d?"戻す":"非表示"}">${d?"↺":"×"}</button>`; }

// ===== フィルタ =====
const state = {region:"すべて", field:"すべて", fee:"すべて", ent:"すべて", within:"すべて"};
function chipGroup(id, key, values){
  const g = $(id); g.querySelectorAll("button").forEach(b=>b.remove());
  ["すべて",...values].forEach(v=>{
    const b=document.createElement("button"); b.className="chip"+(state[key]===v?" on":""); b.textContent=v;
    b.onclick=()=>{ state[key]=v; g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); render(); };
    g.appendChild(b);
  });
}
function uniq(k){ return [...new Set(DATA.map(r=>r[k]).filter(Boolean))]; }
function hiddenOn(){ return !$("#showHidden").checked; }
function isHidden(f){ return hiddenOn() && HIDDEN_FIELDS.includes(f); }
function buildChips(){
  chipGroup("#f-region","region",uniq("地域"));
  if(isHidden(state.field)) state.field="すべて";
  chipGroup("#f-field","field",uniq("分野").filter(f=>!isHidden(f)));
  chipGroup("#f-fee","fee",["無料","有料"]);
  chipGroup("#f-ent","ent",["無制限・複数可","無制限のみ"]);
  chipGroup("#f-within","within",["2週間以内","1か月以内","2か月以内"]);
}

function filtered(){
  const q = $("#q").value.trim().toLowerCase();
  const showPast=$("#showPast").checked, onlyPrep=$("#onlyPrep").checked, onlyStar=$("#onlyStar").checked;
  const lim = {"2週間以内":14,"1か月以内":31,"2か月以内":62}[state.within];
  return DATA.filter(r=>{
    if(!showPast && r._left!=null && r._left<0) return false;
    if(isHidden(r["分野"])) return false;
    if(!$("#showStudent").checked && studentOnly(r)) return false;
    if(!$("#showAge").checked && ageOut(r)) return false;
    if(!$("#showDismissed").checked && DISMISSED.has(r._key)) return false;
    if(state.region!=="すべて" && r["地域"]!==state.region) return false;
    if(state.field!=="すべて" && r["分野"]!==state.field) return false;
    if(state.fee==="無料" && !r._free) return false;
    if(state.fee==="有料" && r._free) return false;
    if(state.ent==="無制限・複数可" && !["無制限","複数可"].includes(r["応募数"])) return false;
    if(state.ent==="無制限のみ" && r["応募数"]!=="無制限") return false;
    if(lim && (r._left==null || r._left>lim)) return false;
    if(onlyPrep && !r["フォルダ"]) return false;
    if(onlyStar && !STARS.has(r._key)) return false;
    if(q && !Object.values(r).some(v=>typeof v==="string" && v.toLowerCase().includes(q))) return false;
    return true;
  });
}
function sorted(list){
  const s=$("#sort").value, big=1e15;
  const by = {
    due:(a,b)=>(a._due??big)-(b._due??big),
    prize:(a,b)=>(b._prize??-1)-(a._prize??-1) || (a._due??big)-(b._due??big),
    fee:(a,b)=>(a._fee??big)-(b._fee??big) || (a._due??big)-(b._due??big),
    name:(a,b)=>(a["コンペ"]||"").localeCompare(b["コンペ"]||"","ja"),
  }[s];
  return list.slice().sort(by);
}

function dueBox(r){
  const L=r._left; let cls="";
  if(L!=null && L>=0){ cls = L<=7?"r":L<=14?"o":L<=30?"y":""; }
  const big = L==null? "?" : L<0? "済" : L===0? "今日" : L;
  const unit = L==null||L<=0? "" : "日";
  return `<div class="due ${cls}"><div class="d">${big}<span class="u">${unit}</span></div><div class="dt">${fmt(r._due)}</div></div>`;
}
function rowHTML(r){
  const tags=[];
  if(r["フォルダ"]) tags.push(`<span class="tag prep">準備済み</span>`);
  if(r["状態"] && !["未着手","準備済み"].includes(r["状態"])) tags.push(`<span class="tag warn">${esc(r["状態"])}</span>`);
  tags.push(`<span class="tag">${esc(r["地域"])}</span>`, `<span class="tag">${esc(r["分野"])}</span>`);
  if(r["対象"] && r["対象"]!=="不問") tags.push(`<span class="tag">対象：${esc(r["対象"])}</span>`);
  if(r._reg && r._regLeft>=0) tags.push(`<span class="tag warn">登録締切 ${fmt(r._reg)}・あと${r._regLeft}日</span>`);
  const name = r["URL"]? `<a href="${esc(r["URL"])}" target="_blank" rel="noopener">${esc(r["コンペ"])}</a>` : esc(r["コンペ"]);
  const memo = r["締切メモ"]? `<div class="sub">締切：${esc(r["締切メモ"])}</div>` : "";
  const ent = r["応募数"]||"記載なし";
  const folder = r["フォルダ"];
  const links = [
    r["URL"]? `<a class="btn" href="${esc(r["URL"])}" target="_blank" rel="noopener">公式サイト ↗</a>`:"",
    folder? `${LOCAL?`<a class="btn" href="${esc(FOLDER_BASE+folder+"/")}" target="_blank">📁 ${esc(folder.split("_")[0])}</a>`:""}
             ${LOCAL?`<button class="btn" data-copy="${esc(FOLDER_BASE_WIN+folder)}">パスをコピー</button>`:""}`:"",
    docBtns(r),
  ].join("");
  const detail = [
    r["応募数ルール"]? `応募数ルール：「${esc(r["応募数ルール"])}」`:"",
    r["提出物"]? `提出物：${subList(r["提出物"])}`:"",
    r["提出方法"]? `提出方法：${esc(r["提出方法"])}`:"",
    r["審査の流れ"]? `審査の流れ：${esc(r["審査の流れ"])}`:"",
    r["備考"]? `メモ：${esc(r["備考"])}`:"",
    folder&&LOCAL? `フォルダ：${esc(FOLDER_BASE_WIN+folder)}`:"",
  ].filter(Boolean).join("<br>");
  return `<div class="row${r._left<0?" past":""}${DISMISSED.has(r._key)?" dismissed":""}" data-k="${esc(r._key)}">
    <div class="sx">${cpyBtn(r)}<button class="star${STARS.has(r._key)?" on":""}" title="★をつける（この端末に保存）">★</button>${disBtn(r)}</div>
    ${dueBox(r)}
    <div><div class="name">${name}${r["管理番号"]?`<span class="cid">${esc(r["管理番号"])}</span>`:""}</div>${r["提出物"]?`<div class="sub">提出物：${esc(subShort(r["提出物"]))}</div>`:""}${r["概要"]?`<div class="sub">${esc(r["概要"])}</div>`:""}${memo}<div class="tags">${tags.join("")}</div>
      ${detail? `<button class="more">詳細 ▾</button>`:""}</div>
    <div class="cell"><div class="k">応募料</div><div class="v fee ${r._free?"free":""}">${esc(r["応募料"]||"—")}</div></div>
    <div class="cell"><div class="k">最高賞</div><div class="v">${esc(r["最高賞"]||"—")}${r._prize && !/円/.test(r["最高賞"])? `<div class="sub">${yen(r._prize)}</div>`:""}</div></div>
    <div class="cell"><div class="k">応募数</div><div class="v"><span class="ent ${ENT_CODE[ent]||"N"}">${esc(ent)}</span></div></div>
    <div class="links">${links}</div>
    ${detail? `<div class="detail">${detail}</div>`:""}
  </div>`;
}

function render(){
  const list = sorted(filtered());
  const live = DATA.filter(r=>(r._left==null||r._left>=0) && !isHidden(r["分野"]) && ($("#showStudent").checked || !studentOnly(r)) && ($("#showAge").checked || !ageOut(r)) && !DISMISSED.has(r._key));
  $("#stats").innerHTML = [
    ["表示中", list.length],
    ["1週間以内", live.filter(r=>r._left!=null&&r._left<=7).length],
    ["準備済み", live.filter(r=>r["フォルダ"]).length],
    ["無料×無制限", live.filter(r=>r._free&&r["応募数"]==="無制限").length],
    ...(DISMISSED.size? [["×で非表示", DATA.filter(r=>DISMISSED.has(r._key)).length]] : []),
  ].map(([k,v])=>`<span class="stat"><b>${v}</b>${k}</span>`).join("");
  $("#sortGroup").style.display = VIEW==="list"? "" : "none";
  if(!list.length){ $("#main").innerHTML=`<div class="empty">条件に合うコンペがありません</div>`; return; }
  if(VIEW==="tl"){ renderTimeline(list); return; }
  if(VIEW==="a3"){ renderA3(list); return; }
  let html="", cur=null;
  if($("#sort").value==="due"){
    for(const r of list){
      const m = r._due? `${r._due.getFullYear()}年${r._due.getMonth()+1}月` : "締切未定";
      if(m!==cur){ if(cur!==null) html+="</div>"; html+=`<div class="month">${m}</div><div class="list">`; cur=m; }
      html+=rowHTML(r);
    }
    html+="</div>";
  } else html = `<div class="list" style="margin-top:14px">${list.map(rowHTML).join("")}</div>`;
  $("#main").innerHTML = html;
}

// ===== タイムライン（縦：週、横：分野） =====
let VIEW = (()=>{ try{ const v=localStorage.getItem("compe-view"); return ["tl","list","a3"].includes(v)? v : "tl"; }catch(e){ return "tl"; } })();
const FIELD_ORDER = ["建築・空間","庭園・インスタレーション","プロダクト・家具","アイデア・企画","グラフィック・ロゴ","アワード（完成作品）"];
function fieldList(){ const u=uniq("分野").filter(f=>!isHidden(f)); return [...FIELD_ORDER.filter(f=>u.includes(f)), ...u.filter(f=>!FIELD_ORDER.includes(f))]; }
function gColor(f){ const i=fieldList().indexOf(f); return `var(--g${(i%7)+1})`; }
function monday(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
function leftCls(L){ return L==null||L<0? "" : L<=7?"r":L<=14?"o":L<=30?"y":""; }
function feeBadge(r){
  const t = r._free? (r["応募料"]==="記載なし"?"無料（記載なし）":"無料") : (r["応募料"]||"未確認");
  return `<span class="fee-b ${r._free?"free":""}">${esc(t)}</span>`;
}
function subList(t){
  const items = String(t||"").split(/\s*[／;；\n]\s*/).filter(Boolean);
  return items.length? `<ul class="subs">${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : "";
}
function methodLabel(t){
  if(/実物|作品現物/.test(t)) return "実物の搬入";
  const paper=/紙|郵送|宅配|書留/.test(t), data=/データ|アップロード|PDF|メール|フォーム|オンライン/.test(t);
  if(paper && /または|か、/.test(t)) return "紙かデータ";
  return paper? (data? "紙＋データ" : "紙") : "データ";
}
function stageShort(t){ const n=(String(t).match(/→/g)||[]).length+1; return n===1? "審査1回" : `審査${n}段階`; }
function subShort(t){ return String(t||"").split(/\s*[／;；\n]\s*/).filter(Boolean).join("・"); }
function cardHTML(r, isReg){
  const d = isReg? r._reg : r._due, L = isReg? r._regLeft : r._left;
  const leftTxt = L==null? "" : L<0? "締切済" : L===0? "今日" : `あと${L}日`;
  const name = r["URL"]? `<a href="${esc(r["URL"])}" target="_blank" rel="noopener">${esc(r["コンペ"])}</a>` : esc(r["コンペ"]);
  const cid = r["管理番号"]? `<span class="cid">${esc(r["管理番号"])}</span>` : "";
  if(isReg) return `<div class="card reg" style="--gc:${gColor(r["分野"])}" data-k="${esc(r._key)}">
      <div class="c-top"><span class="c-date">${fmt(d)} 登録締切${cid}</span><span class="c-left ${leftCls(L)}">${leftTxt}</span></div>
      <div class="c-name">${name}</div><div class="c-sum">本締切 ${fmt(r._due)}</div></div>`;
  const ent = r["応募数"]||"記載なし", folder=r["フォルダ"];
  const more = [
    r["締切メモ"]? `締切：${esc(r["締切メモ"])}`:"",
    r["対象"]? `対象：${esc(r["対象"])}`:"",
    r["応募数ルール"]? `応募数：「${esc(r["応募数ルール"])}」`:"",
    r["備考"]? `メモ：${esc(r["備考"])}`:"",
    r["提出物"]? `提出物：${subList(r["提出物"])}` : "提出物：未記入（competitions.csv の「提出物」列に書くと出ます）",
    r["提出方法"]? `提出方法：${esc(r["提出方法"])}`:"",
    r["審査の流れ"]? `審査の流れ：${esc(r["審査の流れ"])}`:"",
  ].filter(Boolean).join("<br>") + `<div>${r["URL"]?`<a class="btn" href="${esc(r["URL"])}" target="_blank" rel="noopener">公式サイト ↗</a>`:""}${folder?`${LOCAL?`<a class="btn" href="${esc(FOLDER_BASE+folder+"/")}" target="_blank">📁 ${esc(folder)}</a>`:""}${LOCAL?`<button class="btn" data-copy="${esc(FOLDER_BASE_WIN+folder)}">パスをコピー</button>`:""}`:""}${docBtns(r)}</div>`;
  return `<div class="card${folder?" prep":""}${L<0?" past":""}${DISMISSED.has(r._key)?" dismissed":""}" style="--gc:${gColor(r["分野"])}" data-k="${esc(r._key)}">
    <div class="c-top"><span class="c-date">${fmt(d)}${cid}</span><span class="c-left ${leftCls(L)}">${leftTxt}</span></div>
    <div class="c-name">${name}</div>
    ${r["概要"]?`<div class="c-sum">${esc(r["概要"])}</div>`:""}
    <div class="c-prize">賞金 <b>${esc(r["最高賞"]||"—")}</b>${r._prize && !/円/.test(r["最高賞"])? `<span>（${yen(r._prize)}）</span>`:""}</div>
    ${r["提出方法"]||r["審査の流れ"]?`<div class="c-judge">${r["提出方法"]?`<span class="m ${methodLabel(r["提出方法"])==="データ"?"":"paper"}">${methodLabel(r["提出方法"])}</span>`:""}${r["審査の流れ"]?esc(stageShort(r["審査の流れ"])):""}</div>`:""}
    ${r["提出物"]?`<div class="c-subs"><span>提出物</span> ${esc(subShort(r["提出物"]))}</div>`:""}
    <div class="c-foot"><span class="gtag">${esc(r["分野"])}</span>${feeBadge(r)}<span class="ent ${ENT_CODE[ent]||"N"}">${esc(ent)}</span>${!LOCAL?a3Btn(r):""}
      ${cpyBtn(r)}<button class="star${STARS.has(r._key)?" on":""}" title="★をつける">★</button>${disBtn(r)}</div>
    <div class="c-more">${more}</div>
  </div>`;
}
function renderTimeline(list){
  const fields = state.field==="すべて"? fieldList() : [state.field];
  const items=[];
  for(const r of list){
    if(r._due) items.push({r, d:r._due, reg:false});
    if(r._reg && r._reg < r._due && ($("#showPast").checked || r._regLeft>=0)) items.push({r, d:r._reg, reg:true});
  }
  const undated = list.filter(r=>!r._due);
  items.sort((a,b)=>a.d-b.d);
  const DAY=86400000, w0 = monday(items.length? Math.min(items[0].d, today) : today);
  const wmax = items.length? Math.floor((monday(items[items.length-1].d)-w0)/DAY/7) : 0;
  const thisWeek = Math.floor((monday(today)-w0)/DAY/7);
  const buckets = Array.from({length:wmax+1},()=>Object.fromEntries(fields.map(f=>[f,[]])));
  for(const it of items){ const w=Math.floor((monday(it.d)-w0)/DAY/7); (buckets[w][it.r["分野"]]||[]).push(it); }
  const cols = `110px repeat(${fields.length}, minmax(170px,1fr))`;
  let h = `<div class="tl" style="grid-template-columns:${cols}"><div class="tl-head"><div>週</div>${fields.map(f=>{
      const n=items.filter(i=>!i.reg&&i.r["分野"]===f).length;
      return `<div class="gname" style="--gc:${gColor(f)}">${esc(f)}<small>${n}件</small></div>`;}).join("")}</div>`;
  let prevMonth=null;
  buckets.forEach((b,w)=>{
    const s=new Date(w0.getTime()+w*7*DAY), e=new Date(s.getTime()+6*DAY);
    const diff=w-thisWeek, rel = diff===0?"今週":diff===1?"来週":diff<0?`${-diff}週前`:`${diff}週後`;
    const empty = fields.every(f=>!b[f].length);
    const mStart = s.getMonth()!==prevMonth; prevMonth=s.getMonth();
    h += `<div class="tl-row${w%2?" alt":""}${mStart&&w>0?" mstart":""}"${empty?' data-empty="1"':""}>
      <div class="wk${diff===0?" now":""}"><div class="m">${s.getMonth()+1}/${s.getDate()}〜${e.getMonth()!==s.getMonth()?(e.getMonth()+1)+"/":""}${e.getDate()}</div><div class="rel">${rel}</div></div>
      ${fields.map(f=>`<div class="cellg">${b[f].map(it=>cardHTML(it.r,it.reg)).join("")}</div>`).join("")}</div>`;
  });
  h += `</div>`;
  if(undated.length) h += `<div class="month">締切未定</div><div class="list">${undated.map(rowHTML).join("")}</div>`;
  $("#main").innerHTML = h;
  $("#main").style.setProperty("--hh", (window.innerWidth>1000? $("header").offsetHeight : 0)+"px");
}
let A3LIST=[];
function renderA3(list){
  const rows = list.filter(a3code).sort((a,b)=>(a._due??1e15)-(b._due??1e15));
  A3LIST = rows.map(r=>({c:a3code(r), r}));
  if(!rows.length){ $("#main").innerHTML=`<div class="empty">今の条件で、A3ペライチのあるコンペはありません。</div>`; return; }
  $("#main").innerHTML = `<div class="a3grid">${rows.map(r=>{
    const L=r._left, lf = L==null? "" : L<0? "締切済" : L===0? "今日" : `あと${L}日`;
    return `<button class="a3tile${L<0?" past":""}" type="button" data-a3="${a3code(r)}">
      <img src="a3/${a3code(r)}_s.jpg" alt="${esc(r["コンペ"])} のA3ペライチ" loading="lazy">
      <div class="t"><span class="nm">${fmt(r._due)} ${esc(r["コンペ"])}</span><span class="lf ${leftCls(L)}">${lf}</span></div></button>`;
  }).join("")}</div><div class="a3note">タップで大きく開きます。中身は作成した日の内容です（残り日数も作成日時点）。</div>`;
}

// ===== A3 ビューア =====
let LB = {i:0, list:[]};
function a3Ordered(){
  // 今見えている順（A3 一覧があればその順、なければ締切順）
  if(VIEW==="a3" && A3LIST.length) return A3LIST;
  return DATA.filter(a3code).sort((a,b)=>(a._due??1e15)-(b._due??1e15)).map(r=>({c:a3code(r), r}));
}
function openA3(code){
  LB.list = a3Ordered(); LB.i = Math.max(0, LB.list.findIndex(x=>x.c===code));
  if(!LB.list.length) return;
  $("#lb").hidden = false; document.body.style.overflow="hidden"; showA3(true);
}
function showA3(fit){
  const it = LB.list[LB.i], r = it.r, body=$("#lbBody"), img=$("#lbImg");
  $("#lbTitle").innerHTML = `${esc(r["コンペ"])}<small>${fmt(r._due)} 締切・${LB.i+1}/${LB.list.length}</small>`;
  if(fit!==undefined) setZoom(fit);
  img.alt = `${r["コンペ"]} のA3ペライチ`;
  img.src = `a3/${it.c}.jpg`;
  $("#lbPdf").href = `a3/${it.c}.pdf`;
  $("#lbPrev").disabled = LB.i===0; $("#lbNext").disabled = LB.i===LB.list.length-1;
  body.scrollTop = 0; body.scrollLeft = 0;
}
function setZoom(fit){
  const body=$("#lbBody"), img=$("#lbImg");
  body.classList.toggle("fit", fit);
  img.style.width = fit? "" : Math.max(1600, Math.round(body.clientWidth*2.2))+"px";
  $("#lbZoom").textContent = fit? "拡大" : "全体";
}
function closeA3(){ $("#lb").hidden = true; document.body.style.overflow=""; }
$("#lbClose").onclick = closeA3;
$("#lbPrev").onclick = ()=>{ if(LB.i>0){ LB.i--; showA3(true); } };
$("#lbNext").onclick = ()=>{ if(LB.i<LB.list.length-1){ LB.i++; showA3(true); } };
$("#lbZoom").onclick = ()=>setZoom(!$("#lbBody").classList.contains("fit"));
$("#lbImg").addEventListener("dblclick", e=>{
  const body=$("#lbBody"), wasFit=body.classList.contains("fit");
  const rect=e.target.getBoundingClientRect(), fx=(e.clientX-rect.left)/rect.width, fy=(e.clientY-rect.top)/rect.height;
  setZoom(!wasFit);
  if(wasFit) requestAnimationFrame(()=>{ const img=$("#lbImg"); body.scrollLeft=fx*img.offsetWidth-body.clientWidth/2; body.scrollTop=fy*img.offsetHeight-body.clientHeight/2; });
});

(()=>{ let x0=null, y0=null;
  $("#lbBody").addEventListener("touchstart", e=>{ if(e.touches.length===1){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; } else x0=null; }, {passive:true});
  $("#lbBody").addEventListener("touchend", e=>{

$("#main").addEventListener("click", e=>{

  const cp0 = e.target.dataset && e.target.dataset.copy;

  if(e.target.classList.contains("cpy")){ copyText(e.target.dataset.name, `コピーしました：${e.target.dataset.name}`); return; }
  if(e.target.classList.contains("dis")){
    const el=e.target.closest("[data-k]"); if(!el) return; const k=el.dataset.k;
    if(DISMISSED.has(k)){ DISMISSED.delete(k); toast("戻しました"); }
    else { DISMISSED.add(k); toast("非表示にしました（「×で隠したものも表示」で戻せます）"); }
    setDismissed(DISMISSED); render(); return;
  }
  const card = e.target.closest(".card");
  if(card){
    if(e.target.classList.contains("star")){
      const k=card.dataset.k; STARS.has(k)? STARS.delete(k) : STARS.add(k); setStars(STARS);
      e.target.classList.toggle("on"); if($("#onlyStar").checked) render(); return;
    }
    if(!e.target.closest("a,button")) card.classList.toggle("open");
    return;
  }
  const row = e.target.closest(".row"); if(!row) return;
  if(e.target.classList.contains("star")){
    const k=row.dataset.k; STARS.has(k)? STARS.delete(k) : STARS.add(k); setStars(STARS);
    e.target.classList.toggle("on"); if($("#onlyStar").checked) render(); return;
  }
  if(e.target.classList.contains("more")){ row.classList.toggle("open"); return; }
});

// ===== ★×の書き出し・読み込み（端末どうしで合わせる） =====
// 締切が直って key が変わった印は、コンペ名が同じ行に付け替える
function remapKeys(set){
  const keys=new Set(DATA.map(r=>r._key)), byName={};
  DATA.forEach(r=>{ byName[r["コンペ"]||""]=r._key; });
  let n=0; const out=new Set();
  set.forEach(k=>{ if(keys.has(k)){ out.add(k); return; } const nk=byName[k.split("|")[0]]; if(nk){ out.add(nk); n++; } else out.add(k); });
  return [out,n];
}
function migrateMarks(){
  if(typeof STARS==="undefined") return;
  let a,b; [STARS,a]=remapKeys(STARS); [DISMISSED,b]=remapKeys(DISMISSED);
  if(a) setStars(STARS); if(b) setDismissed(DISMISSED);
}
$("#exportMarks").onclick=async()=>{
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  const name=`compe-marks_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  const body=JSON.stringify({app:"competition_list", exported:d.toISOString(), stars:[...STARS], dismissed:[...DISMISSED]}, null, 1);
  // Claude アプリ内（iPad 版）では保存の確認を通して書き出す
  let dl=null; try{ if(window.claude && window.claude.use) dl=await window.claude.use("downloads"); }catch(err){}
  if(dl){
    try{ await dl.save({filename:name, data:body}); toast(`書き出しました：★${STARS.size}件・×${DISMISSED.size}件`); }
    catch(err){ if(!err || err.code!=="declined") toast("この画面では書き出せませんでした"); }
    return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([body],{type:"application/json"})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  toast(`書き出しました：★${STARS.size}件・×${DISMISSED.size}件`);
};
$("#importMarks").onclick=()=>$("#marksFile").click();
$("#marksFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{
    let j; try{ j=JSON.parse(t); }catch(err){ toast("読み込めませんでした（★×のファイルではありません）"); return; }
    const s0=STARS.size, d0=DISMISSED.size;
    (j.stars||[]).forEach(k=>STARS.add(k)); (j.dismissed||[]).forEach(k=>DISMISSED.add(k));
    migrateMarks(); setStars(STARS); setDismissed(DISMISSED); render();
    toast(`合わせました：★ +${STARS.size-s0}件・× +${DISMISSED.size-d0}件`);
  });
  e.target.value="";
};
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1600); }
